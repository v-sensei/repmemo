  e = e.map(x => EX_PATCH[x.id] && !x.pv ? { ...x, ...EX_PATCH[x.id], notes: x.notes || EX_PATCH[x.id].notes || '', pv: 1 } : x);
  const hasEx2 = id => e.some(x => x.id === id);
  PROG_TPLS.forEach(tp => {
    const cur = t.find(x => x.id === tp.id);
    const full = { ...tp, exerciseIds: tp.exerciseIds.filter(hasEx2) };
    if (!cur) t = [...t, full];
    else if (!cur.plan && !cur.kind) t = t.map(x => x.id === tp.id ? full : x);
  });
  return [e, t];
};

function Stepper({ value, onChange, step, list, unit, disabled, start }) {
  const C = useC();
  const num = parseFloat(value);
  const cur = isNaN(num) ? null : num;
  const bump = dir => {
    if (disabled) return;
    let nv;
    if (cur === null) nv = dir > 0 ? (start || (list ? list[0] : step)) : 0;
    else if (list) {
      const cand = dir > 0 ? list.filter(x => x > cur + 1e-9) : list.filter(x => x < cur - 1e-9);
      nv = cand.length ? (dir > 0 ? cand[0] : cand[cand.length - 1]) : cur;
    } else nv = Math.max(0, +(cur + dir * step).toFixed(2));
    onChange(String(nv));
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch {} }
  };
  const bt = { background: 'none', border: 'none', color: disabled ? C.border : C.accent, fontSize: 22, fontWeight: 700, width: 34, height: 46, cursor: 'pointer', flexShrink: 0 };
  return html`
    <div style=${{ display: 'flex', alignItems: 'center', background: C.card2, border: '1px solid ' + C.border, borderRadius: 14, overflow: 'hidden' }}>
      <button onClick=${() => bump(-1)} style=${bt}>−</button>
      <div style=${{ flex: 1, minWidth: 0, textAlign: 'center', lineHeight: 1.1 }}>
        <input type="number" inputMode="decimal" value=${value} placeholder="—" disabled=${disabled} onInput=${e => onChange(e.target.value)} style=${{ width: '100%', background: 'none', border: 'none', color: C.text, textAlign: 'center', fontFamily: FD, fontSize: 28, fontWeight: 800, padding: '3px 0 0', margin: 0, boxSizing: 'border-box', minWidth: 0, outline: 'none' }} />
        <div style=${{ fontSize: 9, color: C.muted, paddingBottom: 4, whiteSpace: 'nowrap' }}>${unit}</div>
      </div>
      <button onClick=${() => bump(1)} style=${bt}>+</button>
    </div>
  `;
}

const compressImg = file => new Promise(res => {
  const r = new FileReader();
  r.onload = ev => {
    const orig = ev.target.result;
    const img = new Image();
    img.onload = () => {
      try {
        const M = 900, k = Math.min(1, M / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.72));
      } catch { res(orig); }
    };
    img.onerror = () => res(orig);
    img.src = orig;
  };
  r.onerror = () => res(null);
  r.readAsDataURL(file);
});

// Simple SVG line chart
function SvgLine({ data, color, h = 130 }) {
  const C = useC();
  if (!data || data.length < 2) return null;
  const vals = data.map(d => d.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const W = 300, H = h - 30;
  const pts = data.map((d, i) => {
    const x = 10 + (i / (data.length - 1)) * (W - 20);
    const y = 10 + (1 - (d.v - min) / range) * (H - 20);
    return x + ',' + y;
  }).join(' ');
  return html`
    <div style=${{ width:'100%', overflowX:'hidden' }}>
      <svg viewBox=${'0 0 ' + W + ' ' + H} style=${{ width:'100%', height:h+'px' }}>
        <polyline points=${pts} fill="none" stroke=${color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
        ${data.map((d, i) => {
          const x = 10 + (i / (data.length - 1)) * (W - 20);
          const y = 10 + (1 - (d.v - min) / range) * (H - 20);
          return html`<circle key=${i} cx=${x} cy=${y} r="3" fill=${color} />`;
        })}
        ${data.map((d, i) => {
          const x = 10 + (i / (data.length - 1)) * (W - 20);
          return html`<text key=${i} x=${x} y=${H - 2} textAnchor="middle" fontSize="9" fill=${C.muted}>${d.d}</text>`;
        })}
      </svg>
    </div>
  `;
}

    const get = async () => { try { lock = await navigator.wakeLock.request('screen'); } catch {} };
    get();
    const vis = () => { if (document.visibilityState === 'visible' && !off) get(); };
    document.addEventListener('visibilitychange', vis);
    return () => { off = true; document.removeEventListener('visibilitychange', vis); try { lock && lock.release(); } catch {} };
  }, [view]);

  useEffect(() => { if (aWo && view === 'home') setView('active'); }, [aWo]);

  // L'heure de départ vit dans la séance sauvegardée : la durée reste juste après un retour dans l'app
  const startedAt = aWo ? aWo.startedAt : null;
  useEffect(() => {
    if (startedAt) { t0.current = startedAt; setElapsed(Math.round((Date.now() - startedAt) / 60000)); }
  }, [startedAt]);

  useEffect(() => {
    if (view !== 'active') return;
    const tick = () => { if (t0.current) setElapsed(Math.round((Date.now() - t0.current) / 60000)); };
    const iv = setInterval(tick, 10000);
    document.addEventListener('visibilitychange', tick);
    return () => { clearInterval(iv); document.removeEventListener('visibilitychange', tick); };
  }, [view]);

  // Historique d'un exercice (séances hors décharge), de la plus récente à la plus ancienne, de préférence dans le même modèle
  const topW = sets => sets.reduce((m, x) => +x.weight > m ? +x.weight : m, 0);
  const avgR = sets => sets.length ? sets.reduce((q, x) => q + (+x.reps || 0), 0) / sets.length : 0;
  const better = (older, newer) => { const a1 = topW(older), b1 = topW(newer); return b1 > a1 || (b1 === a1 && avgR(newer) > avgR(older) + 1e-9); };
  const histFor = (exId, tplId) => {
    const all = [...wos].filter(w => !w.deload && w.kind !== 'run').sort((x, y) => new Date(y.date) - new Date(x.date));
    const pick = f => all.filter(f).map(w => w.exercises.find(e => e.exerciseId === exId)).filter(Boolean);
    const own = tplId ? pick(w => w.tplId === tplId) : [];
    return own.length ? own : pick(() => true);
  };

  const mkEx = (exId, rx, plan, o) => {
    o = o || {};
    const ex = exs.find(e => e.id === exId);
    const meta = plan ? { lbl: plan.lbl, rir: o.deload && !rx ? '3' : plan.rir, rest: plan.rest, ss: plan.ss || null, rng: plan.r !== 'plan' ? plan.r : null, side: !!plan.side, nPlan: plan.n } : {};
    const base = { id: uid(), exerciseId: exId, exerciseName: ex ? ex.name : '?', bw: !!(ex && ex.bw), unit: ex && ex.unit ? ex.unit : null, ...meta };
    if (rx) {
      const work = Array.from({ length: rx.n }, () => ({ id: uid(), weight: rx.kg, reps: '', tgt: rx.r, completed: false, note: '' }));
      return { ...base, bilateral: false, perDb: true, rx, sets: work };
    }
    const stp = ex ? defStep(ex) : 2.5;
    const stepUp = w => ex && ex.perDb ? ((DB_WEIGHTS.filter(x => x > +w)[0]) || +w) : +(+w + stp).toFixed(2);
    // Séance programmée : plan du modèle (séries, fourchette de reps, repos)
    if (plan && plan.r !== 'plan') {
      const h = histFor(exId, o.tplId);
      const lp = h[0] ? h[0].sets : [];
      const rTop = parseInt(String(plan.r).split('-').pop(), 10) || 12;
      let n = plan.n, flag = null, flagInfo = null, wf = w => +w;
      const bump = !o.deload && !plan.nb && lp.length >= plan.n && lp.every(x => +x.reps >= rTop);
      if (bump) wf = stepUp;
      else if (!o.deload && o.stag !== false && h.length >= 2) {
        const stuck = !better(h[1].sets, h[0].sets);
        const sum = h.slice(0, 3).map(x => topW(x.sets) + ' kg × ' + (Math.round(avgR(x.sets) * 10) / 10)).join(' / ');
        if (stuck && h[0].extra) { wf = w => Math.max(0, +(Math.round(+w * 0.9 / stp) * stp).toFixed(2)); flag = 'drop'; flagInfo = sum; }
        else if (stuck && !h[0].extra && h.length >= 3 && !better(h[2].sets, h[1].sets)) { n = plan.n + 1; flag = 'plus'; flagInfo = sum; }
      }
      if (o.deload) n = Math.max(1, plan.n - 1);
      const sets = Array.from({ length: n }, (_, i) => {
        const src = lp[i] || lp[lp.length - 1];
        return { id: uid(), weight: src ? wf(src.weight) : 0, reps: src && lp[i] && !bump && flag !== 'drop' ? String(lp[i].reps) : '', tgt: plan.r, completed: false, note: '' };
      });
      const tw = topW(lp);
      return { ...base, bilateral: ex ? !!ex.bilateral : false, perDb: ex ? !!ex.perDb : false, step: stp, flag, flagInfo, extra: flag === 'plus',
        up: bump && stepUp(tw) !== tw ? { from: tw, to: stepUp(tw), sets: lp.length, reps: rTop } : null,
        last: lp.map(x => ({ weight: x.weight, reps: x.reps })), sets };
    }
    // Séance libre : montée de charge automatique sur le plafond de reps de l'exercice
    const lp = lastPerf(exId);
    const dw = lp[0] ? lp[0].weight : 0;
    const rm = ex && ex.repMax !== undefined && ex.repMax !== '' ? +ex.repMax : 12;
    const bump = rm > 0 && lp.length >= 3 && lp.every(x => +x.reps >= rm);
    const up = w => bump ? stepUp(w) : +w;
    const tw = lp.reduce((m, x) => +x.weight > m ? +x.weight : m, 0);
    const upInfo = bump && up(tw) !== tw ? { from: tw, to: up(tw), sets: lp.length, reps: rm } : null;
    return {
      ...base, bilateral: ex ? !!ex.bilateral : false, perDb: ex ? !!ex.perDb : false,
      up: upInfo, step: stp,
      sets: Array.from({ length: Math.max(lp.length || 0, 3) }, (_, i) => ({
        id: uid(), weight: lp[i] ? up(lp[i].weight) : up(dw), reps: lp[i] && !bump ? String(lp[i].reps) : '', tgt: bump ? '< ' + rm : undefined, completed: false, note: ''
      }))
    };
  };

  const startRun = tpl => {
    if (run.pend) { setView('home'); return; }
    t0.current = Date.now(); setElapsed(0);
    setAWo({ id: uid(), name: tpl.name, tplId: tpl.id, kind: 'run', date: nowISO(), startedAt: Date.now(), notes: '',
      level: Math.min(12, Math.max(1, run.level)), sortie: tpl.id === 'c1' ? 1 : 2, bike: run.bike > 0,
      run: { min: '', km: '', talk: null, pain: false }, exercises: [] });
    setView('active');
  };

  const updRun = (f, v) => setAWo(p => ({ ...p, run: { ...p.run, [f]: v } }));
  const pace = (min, km) => (+km > 0 && +min > 0) ? (Math.floor(+min / +km) + ':' + String(Math.round((+min / +km % 1) * 60) % 60).padStart(2, '0') + ' /km') : null;

  const finishRun = () => {
    const st = aWo.startedAt || t0.current;
    const r = aWo.run;
    const dur = +r.min > 0 ? +r.min : Math.round((Date.now() - st) / 60000);
    const km = +r.km > 0 ? +r.km : 0;
    const talk = r.talk !== false;
    const lv = aWo.level;
    const done = { ...aWo, date: nowISO(), duration: dur, isCompleted: true, run: { ...r, min: dur, km: km || '', talk } };
    let nr = { ...run }, msg;
    if (aWo.bike) {
      nr.bike = Math.max(0, (run.bike || 0) - 1);
      msg = nr.bike > 0 ? 'Vélo fait. Encore ' + nr.bike + ' sortie de vélo avant de reprendre la course au niveau ' + lv + '.' : 'Vélo fait. La prochaine course reprend au niveau ' + lv + '.';
    } else if (r.pain) {
      nr = { ...run, c1: null, c2: null, bike: 2, level: Math.max(1, lv - 1) };
      msg = 'Douleur pendant la sortie : les 2 prochaines sorties sont remplacées par 30 min de vélo, puis tu reprends au niveau ' + nr.level + '.';
    } else if (aWo.sortie === 1) {
      nr.c1 = { talk, min: dur, km };
      msg = 'Course 1 du niveau ' + lv + ' enregistrée' + (talk ? '' : ' (allure de conversation non tenue)') + '. Course 2 au moins 48 h après.';
    } else {
      const ok = !!(run.c1 && run.c1.talk && talk);
      nr.c2 = { talk, min: dur, km };
      if (lv >= 12) {
        msg = 'Test du niveau 12 terminé' + (km >= 5 ? ' : ' + km + ' km en ' + dur + ' min.' : '. Note ton temps sur 5 km.');
        nr.c1 = null; nr.c2 = null;
      } else if (ok) {
        nr.pend = true;
        msg = 'Niveau ' + lv + ' : 2 sorties tenues à allure de conversation. Sur l\'accueil, confirme que rien ne fait mal 48 h après pour passer au niveau ' + (lv + 1) + '.';
      } else {
        msg = (!run.c1 ? 'Course 1 manquante' : 'Allure de conversation non tenue') + ' : tu refais le niveau ' + lv + ' à la prochaine rotation.';
        nr.c1 = null; nr.c2 = null;
      }
    }
    setRun(nr);
    setWos(prev => [...prev, done]); setAWo(null); setShowRest(false);
    setSummary({ name: done.name, dur, exCnt: 0, ts: 0, tv: 0, recs: [], progMsg: msg, cmp: null,
      tiles: [['timer', 'Durée', dur + ' min'], ['flame', 'Niveau', aWo.bike ? 'Vélo' : lv], ['ruler', 'Distance', km ? km + ' km' : '—'], ['bars', 'Allure', pace(dur, km) || '—']] });
    setView('summary');
  };

  const resolveRun = how => setRun(r => {
    const base = { ...r, c1: null, c2: null, pend: false };
    if (how === 'up') return { ...base, level: Math.min(12, r.level + 1) };
    if (how === 'skip') return { ...base, level: Math.min(12, r.level + 2), skipUsed: true };
    if (how === 'pain') return { ...base, level: Math.max(1, r.level - 1), bike: 2 };
    return base;
  });

  const startWo = (name, ids, tplId) => {
    const tpl = tpls.find(t => t.id === tplId);
    if (tpl && tpl.kind === 'run') return startRun(tpl);
    const plan = tpl && tpl.plan ? tpl.plan : null;
    const deload = !!(plan && prog.on && !prog.finished && (prog.week === 4 || prog.week === 8));
    t0.current = Date.now(); setElapsed(0);
    recAnn.current = {};
    let sess = null;
    if (prog.on && tplId === 'pa') sess = 'A';
    if (prog.on && tplId === 'pb') sess = 'B';
    const rx = sess ? progRx(prog, sess) : null;
    setAWo({
      id: uid(), name, tplId: tplId || null, date: nowISO(), startedAt: Date.now(), notes: '',
      progSess: sess, progWeek: sess ? prog.week : null, rest: rx ? (sess === 'A' ? 210 : 150) : null, deload,
      exercises: (ids || []).map(id => mkEx(id, rx && id === 'e11' ? rx : null, plan ? plan[id] : null, { tplId, deload, stag: opts.stag !== false }))
    });
    setView('active');
  };

  const addEx = exId => { setAWo(p => ({ ...p, exercises: [...p.exercises, mkEx(exId)] })); setShowAdd(false); };

  const updSet = (ei, si, f, v) => setAWo(p => ({
    ...p,
    exercises: p.exercises.map((ex, i) => i !== ei ? ex : {
      ...ex, sets: ex.sets.map((s, j) => j !== si ? s : { ...s, [f]: v })
    })
  }));

  const togSet = (ei, si) => {
    const wex = aWo.exercises[ei], st = wex.sets[si];
    const nowDone = !st.completed;
    if (nowDone) {
      if (navigator.vibrate) { try { navigator.vibrate(25); } catch {} }
      if (!st.warm) {
        const secs = wex.rest !== undefined && wex.rest !== null ? wex.rest : (aWo.rest || rt);
        if (secs > 0) { setRestSecs(secs); setShowRest(true); setRestKey(k => k + 1); }
        const pb = bestWeight(wex.exerciseId);
        if (pb > 0 && +st.weight > pb && !recAnn.current[wex.exerciseId]) {
          recAnn.current[wex.exerciseId] = true;
          setToast('Nouveau record : ' + wex.exerciseName + ' ' + st.weight + ' kg');
          setTimeout(() => setToast(null), 3500);
        }
      }
    }
    setAWo(p => ({
      ...p,
      exercises: p.exercises.map((ex, i) => i !== ei ? ex : {
        ...ex, sets: ex.sets.map((s, j) => j !== si ? s : { ...s, completed: !s.completed })
      })
    }));
  };

  const delSet = (ei, si) => setAWo(p => ({
    ...p,
    exercises: p.exercises.map((ex, i) => i !== ei ? ex : { ...ex, sets: ex.sets.filter((_, j) => j !== si) })
  }));

  const addSet = ei => setAWo(p => {
    const es = [...p.exercises];
    const last = es[ei].sets[es[ei].sets.length - 1];
    es[ei] = { ...es[ei], sets: [...es[ei].sets, { id: uid(), weight: last ? last.weight : 0, reps: '', completed: false, note: '' }] };
    return { ...p, exercises: es };
  });

  const delEx = ei => setAWo(p => ({ ...p, exercises: p.exercises.filter((_, i) => i !== ei) }));

  const moveEx = (ei, dir) => setAWo(p => {
    const es = [...p.exercises];
    const ni = ei + dir;
    if (ni < 0 || ni >= es.length) return p;
    [es[ei], es[ni]] = [es[ni], es[ei]];
    return { ...p, exercises: es };
  });

  const finish = () => {
    const st = aWo.startedAt || t0.current;
    const dur = st ? Math.round((Date.now() - st) / 60000) : 0;
    const recs = [];
    const recMap = {};
    const done = {
      ...aWo, date: nowISO(), duration: dur, isCompleted: true,
      exercises: aWo.exercises.map(ex => {
        const pb = bestWeight(ex.exerciseId);
        const sets = ex.sets.filter(s => !s.warm && (+s.weight > 0 || ex.bw) && +s.reps > 0);
        sets.forEach(s => { if (pb > 0 && +s.weight > pb && +s.weight > (recMap[ex.exerciseName] || 0)) recMap[ex.exerciseName] = +s.weight; });
        return { ...ex, sets };
      }).filter(ex => ex.sets.length > 0)
    };
    let ts = 0, tv = 0;
    done.exercises.forEach(ex => ex.sets.forEach(s => { ts++; tv += (+s.weight || 0) * (+s.reps || 0); }));
    Object.entries(recMap).forEach(([n, wt]) => recs.push(n + ' : ' + wt + ' kg'));
    let cmp = null;
    const prevs = wos.filter(w => done.tplId ? w.tplId === done.tplId : w.name === done.name).sort((a, b) => new Date(b.date) - new Date(a.date));
    if (prevs.length) {
      const pv = prevs[0].exercises.reduce((a, ex) => a + ex.sets.reduce((b, st) => b + (+st.weight || 0) * (+st.reps || 0), 0), 0);
      if (pv > 0) cmp = { pct: Math.round((tv - pv) / pv * 100), date: prevs[0].date };
    }
    // Programme force : validation de la séance, bascule à 50 kg, passage de semaine
    let progMsg = null;
    if (aWo.progSess && prog.on) {
      const src = aWo.exercises.find(e => e.exerciseId === 'e11');
      const rx = src && src.rx;
      const dn = done.exercises.find(e => e.exerciseId === 'e11');
      if (rx && dn) {
        const met = dn.sets.length >= rx.n && dn.sets.every(s => +s.reps >= rx.min);
        let np = { ...prog };
        if (met) np[aWo.progSess === 'A' ? 'doneA' : 'doneB'] = true;
        if (aWo.progSess === 'B' && met && rx.kg === 45 && dn.sets.every(s => +s.reps >= 10)) {
          np.sw50 = true;
          progMsg = 'Tu as fait 10 reps partout à 45 kg : le prochain Push B passe à 50 kg.';
        }
        if (np.doneA && np.doneB) {
          if (prog.week >= 12) { np.finished = true; progMsg = 'Semaine 12 terminée : cycle complété.'; }
          else { np.week = prog.week + 1; np.doneA = false; np.doneB = false; progMsg = (progMsg ? progMsg + ' ' : '') + 'Semaine ' + prog.week + ' validée. Prochaine : semaine ' + np.week + '.'; }
        } else if (!progMsg) {
          progMsg = met ? 'Séance validée pour la semaine ' + prog.week + '.' : 'Même charge la prochaine fois sur cette séance.';
        }
        setProg(np);
      }
    }
    setWos(prev => [...prev, done]); setAWo(null); setShowRest(false);
    setSummary({ name: done.name, dur, exCnt: done.exercises.length, ts, tv: Math.round(tv), recs, progMsg, cmp });
    setView('summary');
  };

  const saveTpl = () => {
    if (!tplForm.name.trim() || !tplForm.exerciseIds.length) return;
    const body = { name: tplForm.name.trim(), icon: tplForm.icon, exerciseIds: tplForm.exerciseIds, plan: buildPlan(tplForm.exerciseIds, tplForm.plan || {}) };
    if (editTpl) setTpls(p => p.map(t => t.id === editTpl ? { ...t, ...body } : t));
    else setTpls(p => [...p, { id: uid(), ...body }]);
    setTplForm({ name: '', icon: '💪', exerciseIds: [], plan: {} }); setEditTpl(null); setView('pick');
  };

  const delTpl = id => setTpls(p => p.filter(t => t.id !== id));
  const togTplEx = exId => setTplForm(f => {
    const plan = { ...(f.plan || {}) };
    if (f.exerciseIds.includes(exId)) { delete plan[exId]; return { ...f, plan, exerciseIds: f.exerciseIds.filter(i => i !== exId) }; }
    plan[exId] = exId === 'e11' ? { n:3, r:'plan', rir:'1-2', rest:180, chain:false } : { ...planDef };
    return { ...f, plan, exerciseIds: [...f.exerciseIds, exId] };
  });
  const moveTplEx = (i, dir) => setTplForm(f => {
    const ids = [...f.exerciseIds], j = i + dir;
    if (j < 0 || j >= ids.length) return f;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    return { ...f, exerciseIds: ids };
  });
  const updPlanF = (id, patch) => setTplForm(f => ({ ...f, plan: { ...(f.plan || {}), [id]: { ...((f.plan && f.plan[id]) || planDef), ...patch } } }));

  const doExport = async () => {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf('rm:') === 0) data[k] = localStorage.getItem(k); }
    const payload = JSON.stringify({ app: 'repmemo', v: 2, exportedAt: nowISO(), data });
    const name = 'repmemo-' + today() + '.json';
    try {
      const file = new File([payload], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: 'Sauvegarde RepMemo' });
      else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(file); a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      }
      const now = nowISO(); setLastExp(now); DB.set('rm:lastExport', now);
      setDataMsg('Sauvegarde exportée : ' + name + ' (' + Math.round(payload.length / 1024) + ' Ko)');
    } catch (err) {
      if (!err || err.name !== 'AbortError') setDataMsg('Export impossible : ' + (err && err.message ? err.message : 'erreur inconnue'));
    }
  };
  const doImport = file => {
    const r = new FileReader();
    r.onload = ev => {
      try {
        const o = JSON.parse(ev.target.result);
        if (!o || o.app !== 'repmemo' || !o.data) throw new Error('ce fichier n\'est pas une sauvegarde RepMemo');
        const cnt = k => { try { return JSON.parse(o.data[k]).length; } catch { return 0; } };
        setPendingImp({ data: o.data, at: o.exportedAt, wo: cnt('rm:wo'), ex: cnt('rm:ex'), wt: cnt('rm:wt') });
        setDataMsg(null);
      } catch (err) { setDataMsg('Fichier non reconnu : ' + err.message); }
    };
    r.readAsText(file);
  };
  const applyImport = () => {
    window.__noFlush = true;
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf('rm:') === 0) keys.push(k); }
    keys.forEach(k => localStorage.removeItem(k));
    Object.entries(pendingImp.data).forEach(([k, v]) => { if (k.indexOf('rm:') === 0) localStorage.setItem(k, v); });
    location.reload();
  };
  const daysSinceExp = lastExp ? Math.floor((Date.now() - new Date(lastExp)) / 86400000) : null;

  const wSets = aWo ? aWo.exercises.flatMap(e => e.sets.filter(x => !x.warm)) : [];
  const progDone = wSets.filter(x => x.completed).length, progTot = wSets.length;

  // Sauvegarde et restauration
  if (view === 'data') return html`
    <div style=${{ padding:16, paddingTop:24 }}>
      <${BackBar} title="Sauvegarde" onBack=${() => { setView('home'); setPendingImp(null); setDataMsg(null); }} />
      <div style=${{ ...card(C), marginTop:16, marginBottom:12 }}>
        <div style=${{ fontWeight:700, fontSize:15, marginBottom:4 }}>Exporter mes données</div>
        <div style=${{ fontSize:13, color:C.muted, marginBottom:12 }}>Séances, exercices, modèles, poids, mensurations, photos et réglages dans un seul fichier. Dernière sauvegarde : ${lastExp ? 'il y a ' + daysSinceExp + ' jour' + (daysSinceExp > 1 ? 's' : '') : 'jamais'}.</div>
        <button style=${btnS(C)} onClick=${doExport}>Exporter</button>
      </div>
      <div style=${{ ...card(C), marginBottom:12 }}>
        <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:12 }}>
          <div>
            <div style=${{ fontWeight:700, fontSize:15, marginBottom:4 }}>Règle de stagnation</div>
            <div style=${{ fontSize:13, color:C.muted }}>Après 2 séances sans progrès : une série de plus à même charge, puis −10 % si tu es toujours bloqué.</div>
          </div>
          <button onClick=${() => setOpts(o => ({ ...o, stag: !(o.stag !== false) }))} style=${{ flexShrink:0, background:opts.stag !== false ? C.green : C.card2, color:opts.stag !== false ? '#000' : C.muted, border:'1px solid '+(opts.stag !== false ? C.green : C.border), borderRadius:20, padding:'8px 16px', fontWeight:800, fontSize:13, cursor:'pointer' }}>${opts.stag !== false ? 'Active' : 'Désactivée'}</button>
        </div>
      </div>
      <div style=${{ ...card(C), marginBottom:12 }}>
        <div style=${{ fontWeight:700, fontSize:15, marginBottom:4 }}>Restaurer une sauvegarde</div>
        <div style=${{ fontSize:13, color:C.muted, marginBottom:12 }}>Remplace toutes les données actuelles de cet appareil par celles du fichier.</div>
        ${pendingImp ? html`
          <div style=${{ background:C.amber+'18', border:'1px solid '+C.amber+'55', borderRadius:12, padding:12, marginBottom:10, fontSize:13 }}>
            Sauvegarde du ${pendingImp.at ? fmtDate(pendingImp.at) : '?'} : ${pendingImp.wo} séance${pendingImp.wo > 1 ? 's' : ''}, ${pendingImp.ex} exercice${pendingImp.ex > 1 ? 's' : ''}, ${pendingImp.wt} pesée${pendingImp.wt > 1 ? 's' : ''}. Les données actuelles seront remplacées.
          </div>
          <div style=${{ display:'flex', gap:8 }}>

  // Template form

  // Workout detail
  if (view === 'wo-detail' && selWo) {
    const tv = selWo.exercises.reduce((a, ex) => a + ex.sets.reduce((b, s) => b + (+s.weight || 0) * (+s.reps || 0), 0), 0);

    const isRun = selWo.kind === 'run';
    const rn = selWo.run || {};
    return html`
      <div style=${{ padding:16, paddingTop:24 }}>

              <div key=${val} style=${{ textAlign:'center', background:C.card2, borderRadius:10, padding:'8px 4px' }}>

                <div style=${{ fontWeight:700, fontSize:13, marginTop:2, color:C.accent }}>${val}</div>
              </div>
            `)}
          </div>

          const best = ex.sets.reduce((a, s) => +s.weight > a ? +s.weight : a, 0);

            <div key=${ei} style=${{ ...card(C), marginBottom:10 }}>
              <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>

  if (view === 'summary' && summary) return html`
    <div style=${{ padding:16, paddingTop:24 }}>

        <div style=${{ width:84, height:84, borderRadius:'50%', background:C.grad, display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 12px', boxShadow:'0 12px 34px rgba(124,92,255,.5)', animation:'pop .5s ease-out' }}><${Ico} name="check" color="#fff" size=${44} /></div>

  // Ligne de série (poids, reps, validation) partagée par la carte simple et la vue par tours
  const setRow = (wex, ei, set, si, tag) => html`

  const metaOf = wex => {

  const exCard = (wex, ei) => {

        const meta = [];
        if (wex.rng) meta.push(wex.nPlan + ' × ' + wex.rng + (wex.side ? ' par côté' : ''));

        if (wex.rest) meta.push('repos ' + fmtRest(wex.rest));

        const vol = wex.sets.filter(s => +s.weight > 0 && +s.reps > 0).reduce((a, s) => a + (+s.weight || 0) * (+s.reps || 0), 0);
        return html`
          <div key=${wex.id} style=${{ ...card(C), marginBottom:12 }}>
            <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:8 }}>
              <div style=${{ flex:1 }}>
                <div style=${{ display:'flex', alignItems:'center', gap:8 }}>
                  ${wex.lbl ? html`<span style=${{ ...tagS(C, wex.ss || /[b-c]$/.test(wex.lbl) ? C.accent2 : C.accent), fontFamily:FD, fontSize:15, padding:'2px 8px' }}>${wex.lbl}</span>` : null}
                  <div style=${{ fontFamily:FD, fontWeight:800, fontSize:23, letterSpacing:.2, lineHeight:1.1 }}>${wex.exerciseName}</div>
                </div>
                ${meta.length ? html`<div style=${{ color:C.muted, fontSize:12, marginTop:3 }}>${meta.join(' · ')}</div>` : null}
                ${wex.flag === 'plus' ? html`<div style=${{ color:C.amber, fontSize:13, fontWeight:700, marginTop:2 }}>Stagnation sur 2 séances : même charge, une série de plus.${wex.flagInfo ? ' (' + wex.flagInfo + ')' : ''}</div>` : null}
                ${wex.flag === 'drop' ? html`<div style=${{ color:C.amber, fontSize:13, fontWeight:700, marginTop:2 }}>Toujours bloqué : charge réduite de 10 %, tu remontes ensuite.${wex.flagInfo ? ' (' + wex.flagInfo + ')' : ''}</div>` : null}
                ${wex.rx ? html`<div style=${{ color:C.accent, fontSize:13, fontWeight:700, marginTop:2 }}>Plan : ${wex.rx.n} × ${wex.rx.r} à ${wex.rx.kg} kg par haltère</div>` : null}
                ${wex.up ? html`<div style=${{ color:C.green, fontSize:13, fontWeight:700, marginTop:2 }}>↑ Montée de charge : ${wex.up.from} → ${wex.up.to} kg (${wex.up.sets} × ${wex.up.reps} atteint)</div>` : null}
                ${lp.length > 0 ? html`<div style=${{ color:C.muted, fontSize:12, marginTop:2 }}>Dernière : ${lp.map(s => s.weight + '×' + s.reps).join(' / ')}</div>` : null}
              </div>
              <div style=${{ display:'flex', gap:6, alignItems:'center' }}>
                ${vol > 0 ? html`<span style=${tagS(C, C.amber)}>${vol.toLocaleString('fr')} kg</span>` : null}
                <button onClick=${() => moveEx(ei, -1)} disabled=${ei === 0} style=${{ background:'none', border:'none', color:ei === 0 ? C.border : C.muted, cursor:ei === 0 ? 'default' : 'pointer', fontSize:14, padding:'0 2px' }}>▲</button>
                <button onClick=${() => moveEx(ei, 1)} disabled=${ei === aWo.exercises.length - 1} style=${{ background:'none', border:'none', color:ei === aWo.exercises.length - 1 ? C.border : C.muted, cursor:'pointer', fontSize:14, padding:'0 2px' }}>▼</button>
                <button onClick=${() => delEx(ei)} style=${{ background:'none', border:'none', color:C.muted, cursor:'pointer', fontSize:16, padding:0 }}>✕</button>
              </div>
            </div>
            <div style=${{ marginBottom:8 }}><${ExTimer} /></div>
            ${wex.sets.map((set, si) => setRow(wex, ei, set, si))}
            <button onClick=${() => addSet(ei)} style=${{ marginTop:4, background:'none', border:'1px dashed '+C.border, borderRadius:10, padding:'7px', color:C.muted, cursor:'pointer', width:'100%', fontSize:13 }}>+ Série</button>
          </div>
        `;
  };

  // Exercices enchaînés (4a, 4b, 4c) : une seule carte, séries rangées par tours
  const exGroups = [];
  if (aWo) aWo.exercises.forEach((wex, ei) => {
    const g = exGroups[exGroups.length - 1];
    const prev = g ? aWo.exercises[g[g.length - 1]] : null;
    if (prev && prev.ss && prev.ss === wex.lbl) g.push(ei); else exGroups.push([ei]);
  });
  const grpCard = g => {
    const mem = g.map(ei => [aWo.exercises[ei], ei]);
    const rounds = Math.max(...mem.map(([w]) => w.sets.length));
    return html`
      <div key=${'g' + mem[0][0].id} style=${{ ...card(C), marginBottom:12, borderColor:C.accent2 + '55' }}>
        <div style=${{ fontSize:12, color:C.accent2, fontWeight:700, marginBottom:8 }}>Enchaînés, sans repos entre eux : ${mem.map(([w]) => w.lbl).join(' puis ')}</div>
        ${mem.map(([w, ei]) => {
          const lp = w.last || lastPerf(w.exerciseId);
          return html`
            <div key=${w.id} style=${{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:8 }}>
              <div style=${{ flex:1 }}>
                <div style=${{ display:'flex', alignItems:'center', gap:8 }}>
                  <span style=${{ ...tagS(C, C.accent2), fontFamily:FD, fontSize:15, padding:'2px 8px' }}>${w.lbl}</span>
                  <div style=${{ fontFamily:FD, fontWeight:800, fontSize:21, lineHeight:1.1 }}>${w.exerciseName}</div>
                </div>
                <div style=${{ color:C.muted, fontSize:12, marginTop:3 }}>${metaOf(w).join(' · ')}</div>
                ${w.up ? html`<div style=${{ color:C.green, fontSize:12, fontWeight:700, marginTop:2 }}>↑ Montée de charge : ${w.up.from} → ${w.up.to} kg</div>` : null}
                ${w.flag ? html`<div style=${{ color:C.amber, fontSize:12, fontWeight:700, marginTop:2 }}>${w.flag === 'plus' ? 'Stagnation : une série de plus.' : 'Toujours bloqué : charge réduite de 10 %.'}</div>` : null}
                ${lp.length > 0 ? html`<div style=${{ color:C.muted, fontSize:12, marginTop:2 }}>Dernière : ${lp.map(x => x.weight + '×' + x.reps).join(' / ')}</div>` : null}
              </div>
              <button onClick=${() => delEx(ei)} style=${{ background:'none', border:'none', color:C.muted, cursor:'pointer', fontSize:16, padding:0 }}>✕</button>
            </div>
          `;
        })}
        ${Array.from({ length: rounds }, (_, r) => html`
          <div key=${'r' + r} style=${{ marginTop:6 }}>
            <div style=${{ fontSize:12, color:C.muted, fontWeight:700, marginBottom:6 }}>Tour ${r + 1}</div>
            ${mem.map(([w, ei]) => w.sets[r] ? setRow(w, ei, w.sets[r], r, w.lbl) : null)}
          </div>
        `)}
        <div style=${{ display:'flex', gap:6, marginTop:4 }}>
          ${mem.map(([w, ei]) => html`<button key=${w.id} onClick=${() => addSet(ei)} style=${{ flex:1, background:'none', border:'1px dashed '+C.border, borderRadius:10, padding:'7px', color:C.muted, cursor:'pointer', fontSize:12 }}>+ Série ${w.lbl}</button>`)}
        </div>
      </div>
    `;
  };

  // Course à pied en cours
  if (view === 'active' && aWo && aWo.kind === 'run') {
    const rn = aWo.run, blk = runBlock(aWo.level, aWo.sortie);
    const pc = pace(rn.min, rn.km);
    const choice = (on, txt, f) => html`<button onClick=${f} style=${{ flex:1, background:on ? C.aGlow : C.card2, border:'1px solid '+(on ? C.accent : C.border), borderRadius:12, padding:'12px 8px', color:on ? C.accent : C.muted, cursor:'pointer', fontWeight:700, fontSize:14 }}>${txt}</button>`;
    return html`
      <div style=${{ padding:16, paddingTop:16 }}>
        <div style=${{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
          <div>
            <h2 style=${{ margin:0, fontFamily:FD, fontSize:26, fontWeight:800 }}>${aWo.name}</h2>
            <div style=${{ color:C.muted, fontSize:13, marginTop:2 }}>${elapsed} min</div>
          </div>
          <div style=${{ display:'flex', gap:8 }}>
            <${ConfirmDel} onConfirm=${() => { setAWo(null); setView('home'); }} label="Abandonner" />
            <button style=${{ ...btnS(C, C.green, '#000'), width:'auto', padding:'9px 18px', fontSize:14, borderRadius:10 }} onClick=${finishRun}>Terminer</button>
          </div>
        </div>
        <div style=${{ ...card(C), marginBottom:12 }}>
          ${aWo.bike ? html`
            <div style=${{ fontFamily:FD, fontWeight:800, fontSize:30 }}>30 min de vélo</div>
            <div style=${{ color:C.muted, fontSize:14, marginTop:4 }}>Allure facile, à la place de la course. Ça laisse tes tendons récupérer.</div>
          ` : html`
            <div style=${{ fontFamily:FD, fontWeight:800, fontSize:26 }}>Niveau ${aWo.level}, sortie ${aWo.sortie} sur 2</div>
            <div style=${{ marginTop:10, fontSize:15, lineHeight:1.6 }}>
              <div>5 min de marche rapide</div>
              <div style=${{ fontWeight:800, color:C.accent }}>${blk.b}</div>
              <div>5 min de marche</div>
            </div>
            <div style=${{ color:C.muted, fontSize:13, marginTop:10 }}>${blk.m} min courues. Allure de conversation : tu dois pouvoir dire une phrase complète. Sinon tu ralentis ou tu marches.</div>
            ${aWo.level >= 9 && aWo.level < 12 ? html`<div style=${{ color:C.muted, fontSize:12, marginTop:6 }}>Accélérations : 20 s en montant progressivement jusqu'à une allure rapide mais relâchée, 1 min de trot entre deux.</div>` : null}
          `}
        </div>
        <div style=${{ ...card(C), marginBottom:12 }}>
          <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:10 }}>
            <div><div style=${{ fontSize:12, color:C.muted, marginBottom:4, fontWeight:600 }}>Durée</div><${Stepper} value=${rn.min} unit="min" step=${1} start=${30} onChange=${v => updRun('min', v)} /></div>
            <div><div style=${{ fontSize:12, color:C.muted, marginBottom:4, fontWeight:600 }}>Distance</div><${Stepper} value=${rn.km} unit="km" step=${0.5} start=${3} onChange=${v => updRun('km', v)} /></div>
          </div>
          ${pc ? html`<div style=${{ fontSize:13, color:C.muted, marginBottom:10 }}>Allure moyenne : <b style=${{ color:C.text }}>${pc}</b></div>` : null}
          ${aWo.bike ? null : html`
            <div style=${{ fontSize:12, color:C.muted, marginBottom:6, fontWeight:600 }}>Allure de conversation tenue ?</div>
            <div style=${{ display:'flex', gap:8, marginBottom:12 }}>${choice(rn.talk !== false, 'Oui', () => updRun('talk', true))}${choice(rn.talk === false, 'Non', () => updRun('talk', false))}</div>
            <div style=${{ fontSize:12, color:C.muted, marginBottom:6, fontWeight:600 }}>Douleur qui augmente pendant la sortie (tibias, genoux, Achille) ?</div>
            <div style=${{ display:'flex', gap:8 }}>${choice(!rn.pain, 'Non', () => updRun('pain', false))}${choice(!!rn.pain, 'Oui', () => updRun('pain', true))}</div>
          `}
        </div>
        <div style=${{ ...card(C), marginBottom:12 }}>
          <label style=${{ display:'block', color:C.muted, fontSize:12, fontWeight:600, marginBottom:6 }}>Note de sortie</label>
          <textarea rows="2" value=${aWo.notes || ''} onInput=${e => setAWo(p => ({ ...p, notes: e.target.value }))} style=${{ ...inpS(C), resize:'none', fontFamily:'inherit', fontSize:13 }} placeholder="Sensations, terrain, météo..."></textarea>
        </div>
      </div>
    `;
  }

  // Active workout
  if (view === 'active' && aWo) return html`
    <div style=${{ padding:16, paddingTop:16 }}>
      <div style=${{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
        <div>
          <h2 style=${{ margin:0, fontFamily:FD, fontSize:26, fontWeight:800 }}>${aWo.name}</h2>
          <div style=${{ color:C.muted, fontSize:13, marginTop:2 }}>⏱ ${elapsed} min</div>
        </div>
        <div style=${{ display:'flex', gap:8 }}>
          <${ConfirmDel} onConfirm=${() => { setAWo(null); setShowRest(false); setView('home'); }} label="Abandonner" />
          <button style=${{ ...btnS(C, C.green, '#000'), width:'auto', padding:'9px 18px', fontSize:14, borderRadius:10 }} onClick=${finish}>Terminer ✓</button>
        </div>
      </div>
      ${toast ? html`
        <div style=${{ position:'fixed', top:14, left:'50%', transform:'translateX(-50%)', zIndex:300, background:'linear-gradient(135deg,'+C.amber+',#ff8a3d)', color:'#1a1030', borderRadius:14, padding:'10px 18px', fontWeight:800, fontSize:14, boxShadow:'0 8px 28px rgba(255,138,61,.45)', maxWidth:'90%', display:'flex', alignItems:'center', gap:8, animation:'pop .4s ease-out' }}><${Ico} name="trophy" color="#1a1030" size=${18} />${toast}</div>
      ` : null}
      ${aWo.deload ? html`<div style=${{ ...card(C), padding:12, marginBottom:12, background:C.amber+'14', border:'1px solid '+C.amber+'44', fontSize:13, fontWeight:600 }}>Rotation de décharge : une série de moins par exercice, mêmes charges, RIR 3. Le décliné suit son plan.</div>` : null}
      <div style=${{ height:6, background:C.card2, borderRadius:3, overflow:'hidden', marginBottom:4 }}>
        <div style=${{ height:'100%', background:'linear-gradient(90deg,'+C.accent+','+C.green+')', width:(progTot ? Math.round(progDone / progTot * 100) : 0)+'%', transition:'width .3s' }}></div>
      </div>
      <div style=${{ fontSize:11, color:C.muted, marginBottom:12 }}>${progDone} / ${progTot} séries</div>
      <div style=${{ display:'flex', alignItems:'center', gap:6, marginBottom:14, flexWrap:'wrap' }}>
        <span style=${{ fontSize:11, color:C.muted, fontWeight:600 }}>Repos :</span>
        ${REST_OPT.map(o => html`
          <button key=${o.v} onClick=${() => setRt(o.v)} style=${{ background:rt === o.v ? C.aGlow : 'none', border:'1px solid '+(rt === o.v ? C.accent : C.border), borderRadius:20, padding:'3px 10px', color:rt === o.v ? C.accent : C.muted, cursor:'pointer', fontSize:11, fontWeight:600 }}>${o.l}</button>
        `)}
      </div>
      ${exGroups.map(g => g.length === 1 ? exCard(aWo.exercises[g[0]], g[0]) : grpCard(g))}
      ${showAdd ? html`
        <div style=${{ ...card(C), marginBottom:12 }}>
          <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
            <div style=${{ fontWeight:700, fontSize:14 }}>Ajouter un exercice</div>
            <button onClick=${() => setShowAdd(false)} style=${{ background:'none', border:'none', color:C.muted, cursor:'pointer', fontSize:18 }}>✕</button>
          </div>
          <div style=${{ maxHeight:260, overflowY:'auto', display:'flex', flexDirection:'column', gap:6 }}>
            ${exs.map(ex => html`
              <button key=${ex.id} onClick=${() => addEx(ex.id)} style=${{ background:C.card2, border:'1px solid '+C.border, borderRadius:10, padding:'10px 12px', cursor:'pointer', textAlign:'left', color:C.text, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <div>
                  <div style=${{ fontWeight:600, fontSize:13 }}>${ex.name}</div>
                  <div style=${{ color:C.muted, fontSize:11, marginTop:1 }}>${ex.muscleGroup}</div>
                </div>
                <span style=${{ color:C.accent, fontSize:20, fontWeight:700 }}>+</span>
              </button>
            `)}
          </div>
        </div>
      ` : html`<button style=${{ ...btnS(C, C.card2, C.accent), border:'1px solid '+C.accent+'44', marginBottom:12 }} onClick=${() => setShowAdd(true)}>+ Ajouter un exercice</button>`}
      <div style=${{ ...card(C), marginBottom:12 }}>
        <label style=${{ display:'block', color:C.muted, fontSize:12, fontWeight:600, marginBottom:6 }}>Note de séance</label>
        <textarea rows="2" value=${aWo.notes || ''} onInput=${e => setAWo(p => ({ ...p, notes: e.target.value }))} style=${{ ...inpS(C), resize:'none', fontFamily:'inherit', fontSize:13 }} placeholder="Fatigue, bonne nuit, PR visé..."></textarea>
      </div>
      ${showRest ? html`<${RestTimer} key=${restKey} onDone=${() => setShowRest(false)} ds=${restSecs} />` : null}
    </div>
  `;

  // Home
  const allR = [...wos].sort((a, b) => new Date(b.date) - new Date(a.date));
  const lastWo = allR[0];
  const avail = ROT.filter(id => tpls.some(t => t.id === id));
  const lastRot = allR.find(w => ROT.includes(w.tplId));
  const li = lastRot ? avail.indexOf(lastRot.tplId) : -1;
  const nextTpl = avail.length ? tpls.find(t => t.id === avail[(li + 1) % avail.length]) : null;
  const nextIdx = nextTpl ? avail.indexOf(nextTpl.id) : -1;
  const deloadWeek = prog.on && !prog.finished && (prog.week === 4 || prog.week === 8);
  const nextRx = nextTpl && prog.on && !prog.finished && (nextTpl.id === 'pa' || nextTpl.id === 'pb') ? progRx(prog, nextTpl.id === 'pa' ? 'A' : 'B') : null;
  const weekStart = (() => { const d = new Date(); const dow = (d.getDay() + 6) % 7; d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - dow); return d.getTime(); })();
  const weekCount = wos.filter(w => new Date(w.date).getTime() >= weekStart).length;
  const recent = search
    ? allR.filter(wo => wo.name.toLowerCase().includes(search.toLowerCase()) || wo.exercises.some(ex => ex.exerciseName.toLowerCase().includes(search.toLowerCase())))
    : allR.slice(0, 15);

  return html`
    <div style=${{ padding:16, paddingTop:20 }}>
      <div style=${{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20 }}>
        <div>
          <h1 style=${{ margin:0, fontFamily:FD, fontStyle:'italic', fontSize:40, fontWeight:800, letterSpacing:0.5, lineHeight:1, background:C.grad, WebkitBackgroundClip:'text', backgroundClip:'text', WebkitTextFillColor:'transparent', display:'inline-block', paddingRight:6 }}>RepMemo</h1>
          <p style=${{ margin:'4px 0 0', color:C.muted, fontSize:14 }}>${weekCount === 0 ? 'Nouvelle semaine, on y va.' : weekCount + ' séance' + (weekCount > 1 ? 's' : '') + ' cette semaine sur ' + goal}</p>
        </div>
        <div style=${{ display:'flex', gap:8 }}>
          <button onClick=${() => setView('data')} style=${{ background:C.card2, border:'1px solid '+C.border, borderRadius:10, padding:'8px 12px', cursor:'pointer', fontSize:12, fontWeight:700, color:C.muted }}>Sauvegarde</button>
          <button onClick=${toggleMode} style=${{ background:C.card2, border:'1px solid '+C.border, borderRadius:10, padding:'8px 10px', cursor:'pointer', fontSize:16 }}><${Ico} name=${mode === 'dark' ? 'sun' : 'moon'} color=${C.muted} size=${18} /></button>
        </div>
      </div>
      ${nextTpl ? html`
        <div style=${{ position:'relative', overflow:'hidden', borderRadius:28, padding:'20px 18px 18px', marginBottom:12, color:'#fff', background:C.grad, boxShadow:'0 18px 44px rgba(124,92,255,.38)', animation:'rise .5s ease-out' }}>
          <svg width="270" height="270" viewBox="0 0 270 270" style=${{ position:'absolute', right:-80, top:-60, opacity:.17, pointerEvents:'none' }}>
            <circle cx="135" cy="135" r="124" fill="none" stroke="#fff" strokeWidth="16" />
            <circle cx="135" cy="135" r="84" fill="none" stroke="#fff" strokeWidth="6" />
            <circle cx="135" cy="135" r="26" fill="#fff" />
          </svg>
          <div style=${{ position:'relative', display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:12 }}>
            <div style=${{ minWidth:0, flex:1 }}>
              <div style=${{ fontSize:13, fontWeight:700, opacity:.88 }}>Séance du jour</div>
              <div style=${{ fontFamily:FD, fontStyle:'italic', fontWeight:800, fontSize:nextTpl.name.length <= 6 ? 68 : nextTpl.name.length <= 8 ? 50 : 40, lineHeight:.9, textTransform:'uppercase', marginTop:8, overflowWrap:'normal' }}>${nextTpl.name}</div>
            </div>
            <div style=${{ textAlign:'center', cursor:'pointer', flexShrink:0 }} onClick=${() => setGoal(g => g >= 7 ? 2 : g + 1)}>
              <${Ring} value=${weekCount} max=${goal} />
              <div style=${{ fontSize:10, opacity:.88, marginTop:-2 }}>sur ${goal} cette semaine</div>
            </div>
          </div>
          ${nextTpl.kind === 'run' ? html`
            <div style=${{ position:'relative', marginTop:18 }}>
              <div style=${{ fontSize:12, fontWeight:700, opacity:.88, marginBottom:6 }}>${run.bike > 0 ? 'Vélo à la place de la course' : 'Sortie ' + (nextTpl.id === 'c1' ? 1 : 2) + ' sur 2, allure de conversation'}</div>
              <div style=${{ display:'flex', gap:8 }}>
                <div style=${{ flex:1, background:'rgba(255,255,255,.17)', borderRadius:14, padding:'8px 12px' }}>
                  <div style=${{ fontFamily:FD, fontWeight:800, fontSize:30, lineHeight:1, whiteSpace:'nowrap' }}>${run.bike > 0 ? 'Vélo' : 'Niveau ' + Math.min(12, run.level)}</div>
                  <div style=${{ fontSize:11, opacity:.85 }}>${run.bike > 0 ? 'récupération' : '12 niveaux'}</div>
                </div>
                <div style=${{ flex:1, background:'rgba(255,255,255,.17)', borderRadius:14, padding:'8px 12px' }}>
                  <div style=${{ fontFamily:FD, fontWeight:800, fontSize:30, lineHeight:1, whiteSpace:'nowrap' }}>${run.bike > 0 ? '30 min' : runBlock(run.level, nextTpl.id === 'c1' ? 1 : 2).m + ' min'}</div>
                  <div style=${{ fontSize:11, opacity:.85 }}>${run.bike > 0 ? 'facile' : 'de course'}</div>
                </div>
              </div>
              ${run.bike > 0 ? null : html`<div style=${{ fontSize:12, opacity:.9, marginTop:8 }}>${runBlock(run.level, nextTpl.id === 'c1' ? 1 : 2).b}</div>`}
            </div>
          ` : nextRx ? html`
            <div style=${{ position:'relative', marginTop:18 }}>
              <div style=${{ fontSize:12, fontWeight:700, opacity:.88, marginBottom:6 }}>Décliné haltères, semaine ${prog.week} sur 12</div>
              <div style=${{ display:'flex', gap:8 }}>
                <div style=${{ flex:1, background:'rgba(255,255,255,.17)', borderRadius:14, padding:'8px 12px' }}>
                  <div style=${{ fontFamily:FD, fontWeight:800, fontSize:34, lineHeight:1 }}>${nextRx.n} × ${nextRx.r}</div>
                  <div style=${{ fontSize:11, opacity:.85 }}>séries × reps</div>
                </div>
                <div style=${{ flex:1, background:'rgba(255,255,255,.17)', borderRadius:14, padding:'8px 12px' }}>
                  <div style=${{ fontFamily:FD, fontWeight:800, fontSize:34, lineHeight:1 }}>${nextRx.kg} kg</div>
                  <div style=${{ fontSize:11, opacity:.85 }}>par haltère</div>
                </div>
              </div>
            </div>
          ` : html`
            <div style=${{ position:'relative', display:'flex', gap:6, flexWrap:'wrap', marginTop:18 }}>
              ${nextTpl.exerciseIds.slice(0, 4).map(id => { const e = exs.find(x => x.id === id); return e ? html`<span key=${id} style=${{ background:'rgba(255,255,255,.17)', borderRadius:6, padding:'4px 9px', fontSize:12, fontWeight:600 }}>${e.name}</span>` : null; })}
            </div>
          `}
          <button disabled=${nextTpl.kind === 'run' && run.pend} onClick=${() => startWo(nextTpl.name, nextTpl.exerciseIds, nextTpl.id)} style=${{ ...btnS(C, '#fff', '#2b1670'), position:'relative', marginTop:16, padding:'14px', boxShadow:'0 8px 24px rgba(20,8,60,.35)', opacity:nextTpl.kind === 'run' && run.pend ? .45 : 1 }}>
            <span style=${{ display:'flex', alignItems:'center', justifyContent:'center', gap:8, fontFamily:FD, fontStyle:'italic', fontSize:24, fontWeight:800, letterSpacing:.5 }}><${Ico} name="play" color="#2b1670" size=${20} />Commencer</span>
          </button>
        </div>
      ` : null}
      <button style=${{ ...btnS(C, 'transparent', C.text), border:'1px solid '+C.border, marginBottom:14, fontWeight:700 }} onClick=${() => setView('pick')}>Autre séance</button>
      ${run.pend ? html`
        <div style=${{ ...card(C), marginBottom:12, background:C.green+'14', border:'1px solid '+C.green+'44' }}>
          <div style=${{ fontWeight:800, fontSize:15, marginBottom:4 }}>Niveau ${run.level} de course : 2 sorties tenues</div>
          <div style=${{ fontSize:13, color:C.muted, marginBottom:10 }}>Rien n'a fait mal dans les 48 h après la Course 2 (tibias, genoux, tendon d'Achille, voûte plantaire) ?</div>
          <div style=${{ display:'flex', flexDirection:'column', gap:8 }}>
            <button style=${btnS(C)} onClick=${() => resolveRun('up')}>${run.level >= 11 ? 'Rien : passer au test (niveau 12)' : 'Rien : passer au niveau ' + (run.level + 1)}</button>
            ${run.level <= 3 && !run.skipUsed ? html`<button style=${btnS(C, C.card2, C.accent)} onClick=${() => resolveRun('skip')}>Trop facile : sauter au niveau ${run.level + 2} (une seule fois)</button>` : null}
            <button style=${btnS(C, C.card2, C.muted)} onClick=${() => resolveRun('redo')}>Refaire le niveau ${run.level}</button>
            <button style=${btnS(C, C.card2, C.red)} onClick=${() => resolveRun('pain')}>Douleur : 2 sorties de vélo, retour au niveau ${Math.max(1, run.level - 1)}</button>
          </div>
        </div>
      ` : null}
      <div style=${{ ...card(C), marginBottom:12, padding:14 }}>
        <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:8 }}>
          <div style=${{ fontWeight:800, fontSize:15 }}>Rotation de 7 séances</div>
          <div style=${{ fontSize:12, color:C.muted }}>Course niveau ${Math.min(12, run.level)}${run.bike > 0 ? ', vélo' : ''}, sorties ${run.c1 ? '1 ✓' : '1'} ${run.c2 ? '2 ✓' : '2'}</div>
        </div>
        <div style=${{ display:'flex', flexWrap:'wrap', gap:6 }}>
          ${avail.map((id, i) => html`<span key=${id} style=${{ ...tagS(C, i < nextIdx ? C.green : i === nextIdx ? C.accent : C.muted), border:i === nextIdx ? '1px solid '+C.accent : '1px solid transparent' }}>${ROT_LBL[id] || id}</span>`)}
        </div>

      setExs(p => p.map(e => e.id === sel.id ? { ...e, ...data } : e));

    const bw = bestWeight(sel.id);
    const lp = lastPerf(sel.id);

    const now2 = Date.now();

// ─── PROGRESS ────────────────────────────────────────────────
function ProgressTab({ wos, exs, prog }) {
  const C = useC();
  const [mo, setMo] = useState(0);

  const stats = useMemo(() => {
    const now = Date.now();
    const sorted = [...wos].sort((a, b) => new Date(a.date) - new Date(b.date));
    const total = wos.length;
    const level = getLevel(total);
    const nextLv = LEVELS.find(l => l.min > level.min) || level;
    const lvPct = total >= nextLv.min ? 100 : Math.round((total - level.min) / (nextLv.min - level.min) * 100);

    let streak = 0;
    const dSet = new Set(wos.map(w => ymd(new Date(w.date))));
    let dd = new Date();
    for (let x = 0; x < 365; x++) {
      const k = ymd(dd);
      if (dSet.has(k)) { streak++; dd.setDate(dd.getDate() - 1); }
      else if (streak > 0) break;
      else dd.setDate(dd.getDate() - 1);
    }

    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d2 = new Date(); d2.setDate(d2.getDate() - i);
      const dk = ymd(d2);
      days.push({ k: dk, label: ['D','L','M','M','J','V','S'][d2.getDay()], trained: dSet.has(dk), isToday: i === 0 });
    }

    const volByDate = sorted.slice(-10).map(w => ({
      d: fmtS(w.date),
      v: Math.round(w.exercises.reduce((a, ex) => a + ex.sets.reduce((b, s) => b + (+s.weight || 0) * (+s.reps || 0), 0), 0))
    }));

    const sortedMs = sorted.map(w => new Date(w.date).getTime());
    const gaps = [];
    for (let gi = 1; gi < sortedMs.length; gi++) gaps.push((sortedMs[gi] - sortedMs[gi-1]) / 86400000);
    const avgGap = gaps.length ? Math.round(gaps.reduce((a, v) => a + v, 0) / gaps.length) : null;
    const lastSess = sorted[sorted.length - 1];
    const daysSince = lastSess ? Math.floor((now - new Date(lastSess.date)) / 86400000) : null;

    const challenges = [];
    exs.forEach(ex => {
      const hist = wos.filter(w => w.exercises.some(e => e.exerciseId === ex.id)).sort((a, b) => new Date(b.date) - new Date(a.date));
      if (!hist.length) return;
      const bw = hist.reduce((m, w) => { const e = w.exercises.find(e => e.exerciseId === ex.id); return e ? e.sets.reduce((a, s) => +s.weight > a ? +s.weight : a, m) : m; }, 0);
      if (!bw) return;
      const last = hist[0].exercises.find(e => e.exerciseId === ex.id);
      const lastW = last ? last.sets.reduce((a, s) => +s.weight > a ? +s.weight : a, 0) : 0;
      const gap = bw - lastW;
      if (gap > 0 && gap <= 5) challenges.push({ name: ex.name, gap, bw });
    });

    const prog = [];
    exs.forEach(ex => {
      const hist = wos.filter(w => w.exercises.some(e => e.exerciseId === ex.id)).sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 2);
      if (hist.length < 2) return;
      const cur = hist[0].exercises.find(e => e.exerciseId === ex.id).sets;
      const prv = hist[1].exercises.find(e => e.exerciseId === ex.id).sets;
      const curW = cur.reduce((a, s) => +s.weight > a ? +s.weight : a, 0);
      const prvW = prv.reduce((a, s) => +s.weight > a ? +s.weight : a, 0);
      const curR = cur.reduce((a, s) => a + (+s.reps || 0), 0);
      const prvR = prv.reduce((a, s) => a + (+s.reps || 0), 0);
      if (curW > prvW) prog.push({ name: ex.name, txt: '+' + (curW - prvW) + ' kg', col: C.green });
      else if (curR > prvR) prog.push({ name: ex.name, txt: '+' + (curR - prvR) + ' reps', col: C.accent });
    });

    const recentRecs = [];
    wos.filter(w => now - new Date(w.date) <= 7 * 86400000).forEach(w => {
      w.exercises.forEach(ex => {
        const allBest = wos
          .filter(w2 => w2.id !== w.id && w2.exercises.some(e => e.exerciseId === ex.exerciseId))
          .reduce((b, w2) => {
            const e = w2.exercises.find(e => e.exerciseId === ex.exerciseId);
            return e ? e.sets.reduce((a, s) => +s.weight > a ? +s.weight : a, b) : b;
          }, 0);
        const thisW = ex.sets.reduce((a, s) => +s.weight > a ? +s.weight : a, 0);
        if (thisW > allBest && thisW > 0) recentRecs.push({ name: ex.exerciseName, weight: thisW, date: w.date });
      });
    });

    return { level, nextLv, lvPct, total, streak, days, volByDate, avgGap, daysSince, challenges, prog, recentRecs };
  }, [wos, exs]);

  const cal = (() => {
    const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + mo);
    const y = base.getFullYear(), m = base.getMonth();
    const first = (new Date(y, m, 1).getDay() + 6) % 7, dim = new Date(y, m + 1, 0).getDate();
    const cnt = {}; wos.forEach(w => { const k = ymd(new Date(w.date)); cnt[k] = (cnt[k] || 0) + 1; });
    const todayK = ymd(new Date());
    const cells = []; for (let i = 0; i < first; i++) cells.push(null);
    for (let d = 1; d <= dim; d++) { const k = ymd(new Date(y, m, d)); cells.push({ d, n: cnt[k] || 0, isToday: k === todayK }); }
    return { label: new Date(y, m, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }), cells, total: cells.filter(c => c && c.n).length };
  })();

  const miles = (() => {
    let vol = 0; wos.forEach(w => w.exercises.forEach(ex => ex.sets.forEach(st => { vol += (+st.weight || 0) * (+st.reps || 0); })));
    const best = id => { let b = 0; wos.forEach(w => w.exercises.forEach(ex => { if (ex.exerciseId === id) ex.sets.forEach(st => { if (+st.weight > b) b = +st.weight; }); })); return b; };
    const L = [];
    [1, 10, 25, 50, 100, 200].forEach(n => L.push({ label: n + (n > 1 ? ' séances' : ' séance'), v: wos.length, t: n, unit: '' }));
    [10, 50, 100, 250].forEach(n => L.push({ label: n + ' tonnes soulevées', v: vol / 1000, t: n, unit: ' t' }));
    [100, 110, 120, 130].forEach(n => L.push({ label: 'Développé couché ' + n + ' kg', v: best('e1'), t: n, unit: ' kg' }));
    L.push({ label: 'Décliné haltères 50 kg', v: best('e11'), t: 50, unit: ' kg' });
    return L;
  })();
  const milesDone = miles.filter(x => x.v >= x.t), milesNext = miles.filter(x => x.v < x.t).sort((a, b) => b.v / b.t - a.v / a.t).slice(0, 3);

  const declRows = (() => {
    const rows = [];
    for (let wk = 1; wk <= 12; wk++) {
      const row = { wk };
      ['A', 'B'].forEach(sess => {
        const hits = wos.filter(w => w.progSess === sess && w.progWeek === wk).sort((x, y) => new Date(y.date) - new Date(x.date));
        const ex = hits[0] && hits[0].exercises.find(e => e.exerciseId === 'e11');
        const plan = ex && ex.rx ? ex.rx : progRx({ ...prog, week: wk }, sess);
        let res = null;
        if (ex) { const reps = ex.sets.map(x => +x.reps); res = { reps, met: reps.length >= plan.n && reps.every(r => r >= plan.min) }; }
        row[sess] = { plan, res };
      });
      rows.push(row);
    }
    return rows;
  })();
  const best50 = (() => { let b = 0; wos.forEach(w => w.exercises.forEach(ex => { if (ex.exerciseId === 'e11') ex.sets.forEach(x => { if (+x.weight >= 50 && +x.reps > b) b = +x.reps; }); })); return b; })();
  const phrases = ['Chaque répétition compte. Continue. 🔥', 'La régularité bat l\'intensité. 💪', 'Ton futur toi te remerciera. ⚡', 'La douleur est temporaire. La fierté est permanente. 🎯'];

  return html`
    <div style=${{ padding:16, paddingTop:24 }}>
      <h2 style=${{ margin:'0 0 16px', fontFamily:FD, fontSize:26, fontWeight:800 }}>Progression</h2>

      <div style=${{ ...card(C), marginBottom:14, background:'linear-gradient(135deg,'+stats.level.col+'18,'+C.card+')' }}>
        <div style=${{ display:'flex', alignItems:'center', gap:12, marginBottom:12 }}>
          <div style=${{ width:58, height:58, borderRadius:'50%', background:'linear-gradient(135deg,'+stats.level.col+','+stats.level.col+'77)', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:FD, fontWeight:800, fontSize:32, color:'#0b0716', flexShrink:0 }}>${LEVELS.indexOf(stats.level) + 1}</div>
          <div style=${{ flex:1 }}>
            <div style=${{ fontSize:11, color:C.muted, fontWeight:700, textTransform:'uppercase' }}>Niveau</div>
            <div style=${{ fontFamily:FD, fontSize:26, fontWeight:800, color:stats.level.col }}>${stats.level.name}</div>
            <div style=${{ fontSize:12, color:C.muted }}>${stats.total} séance${stats.total > 1 ? 's' : ''}</div>
          </div>
          ${stats.streak > 0 ? html`
            <div style=${{ textAlign:'center', background:C.amber+'22', border:'1px solid '+C.amber+'44', borderRadius:12, padding:'8px 12px' }}>
              <div style=${{ display:'flex', justifyContent:'center' }}><${Ico} name="flame" color=${C.amber} size=${22} /></div>
              <div style=${{ fontWeight:800, fontSize:18, color:C.amber, lineHeight:1 }}>${stats.streak}</div>
              <div style=${{ fontSize:10, color:C.muted }}>jours</div>
            </div>
          ` : null}
        </div>
        ${stats.level.min < 9999 ? html`
          <div>
            <div style=${{ display:'flex', justifyContent:'space-between', marginBottom:4 }}>
              <span style=${{ fontSize:11, color:C.muted }}>Vers ${stats.nextLv.name} ${stats.nextLv.icon}</span>
              <span style=${{ fontSize:11, color:C.muted }}>${stats.total}/${stats.nextLv.min}</span>
            </div>
            <div style=${{ height:6, background:C.card2, borderRadius:3, overflow:'hidden' }}>
              <div style=${{ height:'100%', background:stats.level.col, width:stats.lvPct+'%', borderRadius:3 }}></div>
            </div>
          </div>
        ` : null}
      </div>

      <div style=${{ ...card(C), marginBottom:14, background:C.aGlow, border:'1px solid '+C.accent+'33', textAlign:'center', padding:'14px 16px' }}>
        <div style=${{ fontSize:14, fontWeight:600, color:C.text, fontStyle:'italic' }}>${phrases[stats.total % phrases.length]}</div>
      </div>

      ${stats.total > 1 ? html`
        <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:14 }}>
          <div style=${{ ...card(C), textAlign:'center', padding:12 }}>
            <div style=${{ fontFamily:FD, fontSize:26, fontWeight:800, color:C.accent }}>${stats.avgGap !== null ? stats.avgGap + 'j' : '—'}</div>
            <div style=${{ fontSize:11, color:C.muted, marginTop:2 }}>Entre chaque séance</div>
          </div>
          <div style=${{ ...card(C), textAlign:'center', padding:12 }}>
            <div style=${{ fontFamily:FD, fontSize:26, fontWeight:800, color:stats.daysSince === 0 ? C.green : stats.daysSince <= 2 ? C.amber : C.red }}>${stats.daysSince !== null ? stats.daysSince + 'j' : '—'}</div>
            <div style=${{ fontSize:11, color:C.muted, marginTop:2 }}>Depuis la dernière</div>
          </div>
        </div>
      ` : null}

      <div style=${{ ...card(C), marginBottom:14 }}>
        <div style=${{ fontSize:12, color:C.muted, fontWeight:700, marginBottom:10 }}>ACTIVITÉ — 7 DERNIERS JOURS</div>
        <div style=${{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:6 }}>
          ${stats.days.map((d, i) => html`
            <div key=${i} style=${{ textAlign:'center' }}>
              <div style=${{ fontSize:10, color:d.isToday ? C.accent : C.muted, fontWeight:d.isToday ? 700 : 400, marginBottom:4 }}>${d.label}</div>
              <div style=${{ width:'100%', paddingBottom:'100%', position:'relative', borderRadius:8, background:d.trained ? C.accent : C.card2, border:'1px solid '+(d.trained ? C.accent : d.isToday ? C.accent+'55' : C.border) }}>
                ${d.trained ? html`<div style=${{ position:'absolute', top:'50%', left:'50%', transform:'translate(-50%,-50%)', fontSize:11, color:d.trained ? '#000' : C.muted }}>✓</div>` : null}
              </div>
            </div>
          `)}
        </div>
      </div>

      <div style=${{ ...card(C), marginBottom:14 }}>
        <div style=${{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
          <button onClick=${() => setMo(x => x - 1)} style=${{ background:'none', border:'none', color:C.muted, cursor:'pointer', fontSize:24, padding:'0 8px' }}>‹</button>
          <div style=${{ textAlign:'center' }}>
            <div style=${{ fontWeight:800, fontSize:15, textTransform:'capitalize' }}>${cal.label}</div>
            <div style=${{ fontSize:11, color:C.muted }}>${cal.total} jour${cal.total > 1 ? 's' : ''} d'entraînement</div>
          </div>
          <button onClick=${() => setMo(x => Math.min(0, x + 1))} style=${{ background:'none', border:'none', color:mo >= 0 ? C.border : C.muted, cursor:'pointer', fontSize:24, padding:'0 8px' }}>›</button>
        </div>
        <div style=${{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:5 }}>
          ${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((l, i) => html`<div key=${'h' + i} style=${{ textAlign:'center', fontSize:10, color:C.muted, fontWeight:600 }}>${l}</div>`)}
          ${cal.cells.map((c, i) => c ? html`
            <div key=${i} style=${{ aspectRatio:'1', borderRadius:8, display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:c.n ? 800 : 500, color:c.n ? '#fff' : C.muted, background:c.n >= 2 ? C.green : c.n === 1 ? C.accent : C.card2, border:c.isToday ? '2px solid '+C.accent : '1px solid transparent' }}>${c.d}</div>
          ` : html`<div key=${i}></div>`)}
        </div>
      </div>

      <div style=${{ ...card(C), marginBottom:14 }}>
        <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:4 }}>
          <div style=${{ fontWeight:800, fontSize:15 }}>Décliné haltères, 12 semaines</div>
          <div style=${{ fontSize:12, color:C.muted }}>${prog.finished ? 'Cycle terminé' : 'Semaine ' + prog.week + ' sur 12'}</div>
        </div>
        <div style=${{ fontSize:13, color:C.muted, marginBottom:10 }}>Objectif : 3 × 8 à 50 kg par haltère. Meilleure série à 50 kg : <b style=${{ color:best50 >= 8 ? C.green : C.text }}>${best50 ? best50 + ' reps' : 'pas encore'}</b></div>
        <div style=${{ display:'grid', gridTemplateColumns:'26px 1fr 1fr', gap:4, fontSize:11, color:C.muted, fontWeight:700, marginBottom:4 }}><div></div><div>Push A</div><div>Push B</div></div>
        ${declRows.map(r => html`
          <div key=${r.wk} style=${{ display:'grid', gridTemplateColumns:'26px 1fr 1fr', gap:4, alignItems:'stretch', marginBottom:4, background:r.wk === prog.week && !prog.finished ? C.aGlow : 'none', borderRadius:8 }}>
            <div style=${{ fontFamily:FD, fontWeight:800, fontSize:20, display:'flex', alignItems:'center', justifyContent:'center', color:r.wk === prog.week ? C.accent : C.muted }}>${r.wk}</div>
            ${['A', 'B'].map(k => {
              const c = r[k];
              const col = c.res ? (c.res.met ? C.green : C.amber) : C.muted;
              return html`
                <div key=${k} style=${{ padding:'5px 6px', borderRadius:8, border:'1px solid '+(c.res ? col + '66' : C.border), background:c.res ? col + '14' : 'none' }}>
                  <div style=${{ fontSize:12, fontWeight:700, color:c.res ? col : C.text }}>${c.plan.n}×${c.plan.r} · ${c.plan.kg} kg${c.res && c.res.met ? ' ✓' : ''}</div>
                  ${c.res ? html`<div style=${{ fontSize:11, color:col }}>${c.res.reps.join(' · ')}</div>` : null}
                </div>
              `;
            })}
          </div>
        `)}
        <div style=${{ fontSize:11, color:C.muted, marginTop:6 }}>Vert : séance validée. Orange : sous la cible, la semaine ne passe pas. Les charges de Push B à venir supposent ton réglage actuel (45 kg, ou 50 kg une fois la bascule faite).</div>
      </div>

      <div style=${{ ...card(C), marginBottom:14 }}>
        <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:10 }}>
          <div style=${{ fontWeight:800, fontSize:15 }}>Jalons</div>
          <div style=${{ fontSize:12, color:C.muted }}>${milesDone.length} / ${miles.length} débloqués</div>
        </div>
        ${milesNext.map((m, i) => html`
          <div key=${i} style=${{ marginBottom:10 }}>
            <div style=${{ display:'flex', justifyContent:'space-between', fontSize:13, marginBottom:4 }}>
              <span style=${{ fontWeight:600 }}>${m.label}</span>
              <span style=${{ color:C.muted }}>${m.unit === ' t' ? m.v.toFixed(1) : Math.round(m.v)} / ${m.t}${m.unit}</span>
            </div>
            <div style=${{ height:6, background:C.card2, borderRadius:3, overflow:'hidden' }}>
              <div style=${{ height:'100%', background:C.accent, width:Math.min(100, Math.round(m.v / m.t * 100))+'%', borderRadius:3 }}></div>
            </div>
          </div>
        `)}
        ${milesDone.length > 0 ? html`
          <div style=${{ display:'flex', gap:6, flexWrap:'wrap', marginTop:4 }}>
            ${milesDone.map((m, i) => html`<span key=${i} style=${tagS(C, C.green)}>✓ ${m.label}</span>`)}
          </div>
        ` : null}
      </div>

      ${stats.challenges.length > 0 ? html`
        <div style=${{ marginBottom:14 }}>
          <div style=${{ color:C.muted, fontSize:13, fontWeight:700, letterSpacing:0.2, marginBottom:8 }}>Tu y es presque</div>
          ${stats.challenges.map((ch, i) => html`
            <div key=${i} style=${{ ...card(C), marginBottom:6, display:'flex', alignItems:'center', justifyContent:'space-between', background:C.amber+'10', border:'1px solid '+C.amber+'33' }}>
              <div>
                <div style=${{ fontWeight:700, fontSize:14 }}>${ch.name}</div>
                <div style=${{ fontSize:12, color:C.muted }}>Record : ${ch.bw} kg</div>
              </div>
              <div style=${{ textAlign:'right' }}>
                <div style=${{ fontWeight:800, fontSize:16, color:C.amber }}>à ${ch.gap} kg</div>
                <div style=${{ fontSize:11, color:C.muted }}>du record</div>
              </div>
            </div>
          `)}
        </div>
      ` : null}

      ${stats.recentRecs.length > 0 ? html`
        <div style=${{ marginBottom:14 }}>
          <div style=${{ color:C.muted, fontSize:13, fontWeight:700, letterSpacing:0.2, marginBottom:8 }}>Records cette semaine</div>
          ${stats.recentRecs.map((r, i) => html`
            <div key=${i} style=${{ ...card(C), marginBottom:6, display:'flex', justifyContent:'space-between', alignItems:'center', background:C.green+'10', border:'1px solid '+C.green+'33' }}>
              <div>
                <div style=${{ fontWeight:700, fontSize:14 }}>${r.name}</div>
                <div style=${{ fontSize:12, color:C.muted }}>${fmtDate(r.date)}</div>
              </div>
              <span style=${tagS(C, C.green)}>${r.weight} kg 🔥</span>
            </div>
          `)}
        </div>
      ` : null}

      ${stats.volByDate.length > 1 ? html`
        <div style=${{ ...card(C), marginBottom:14 }}>
          <div style=${{ fontWeight:700, fontSize:13, marginBottom:8 }}>Volume par séance</div>
          <${SvgLine} data=${stats.volByDate} color=${C.accent} h=${140} />
        </div>
      ` : null}

      ${stats.prog.length > 0 ? html`
        <div>
          <div style=${{ color:C.muted, fontSize:13, fontWeight:700, letterSpacing:0.2, marginBottom:8 }}>En progression</div>
          ${stats.prog.slice(0, 6).map((pp, i) => html`
            <div key=${i} style=${{ ...card(C), marginBottom:6, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <div style=${{ fontWeight:600, fontSize:14 }}>${pp.name}</div>
              <span style=${tagS(C, pp.col)}>${pp.txt}</span>
            </div>
          `)}
        </div>
      ` : null}

      ${wos.length === 0 ? html`
        <div style=${{ ...card(C), textAlign:'center', padding:36, color:C.muted }}>
          <div style=${{ display:'flex', justifyContent:'center', marginBottom:12 }}><${Ico} name="progress" color=${C.muted} size=${44} /></div>
          <div style=${{ fontWeight:600, color:C.text }}>Aucune séance</div>
        </div>
      ` : null}
    </div>
  `;
}
