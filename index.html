function WeightSub({ wts, setWts }) {
  const C = useC();
  const [view, setView] = useState('main');
  const [sel, setSel] = useState(null);
  const [form, setForm] = useState({ weight: '', date: today(), note: '' });
  const [preview, setPrev] = useState(null);
  const [detPhoto, setDetPhoto] = useState(null);
  const [goal, setGoal] = useState(null);
  const [editGoal, setEG] = useState(false);
  const [goalInput, setGI] = useState('');
  const fileRef = useRef();

  useEffect(() => { DB.get('rm:wgoal', null).then(v => { setGoal(v); setGI(v || ''); }); }, []);
  useEffect(() => { DB.set('rm:wgoal', goal); }, [goal]);
  useEffect(() => { setDetPhoto(null); if (sel && sel.hasPhoto) DB.get('rm:ph:' + sel.id, null).then(setDetPhoto); }, [sel]);

  const addEntry = () => {
    if (!form.weight) return;
    const id = uid();
    const entry = { id, date: form.date, weight: +form.weight, note: form.note, hasPhoto: !!preview, createdAt: nowISO() };
    const p2 = preview ? DB.set('rm:ph:' + id, preview) : Promise.resolve();
    p2.then(() => {
      setWts(prev => [...prev, entry].sort((a, b) => a.date.localeCompare(b.date)));
      setForm({ weight: '', date: today(), note: '' }); setPrev(null); setView('main');
    });
  };

  const delEntry = id => {
    setWts(p => p.filter(e => e.id !== id));
    window.storage.delete('rm:ph:' + id).catch(() => {});
    setView('main');
  };

  const sorted = [...wts].sort((a, b) => a.date.localeCompare(b.date));
  const latest = sorted[sorted.length - 1];
  const first = sorted[0];
  const chartData = sorted.slice(-30).map(e => ({ d: fmtS(e.date), v: e.weight }));

  const stats = useMemo(() => {
    if (!sorted.length) return null;
    const now = Date.now();
    const s7 = sorted.filter(e => now - new Date(e.date) <= 7 * 86400000);
    const s30 = sorted.filter(e => now - new Date(e.date) <= 30 * 86400000);
    const d7 = s7.length >= 2 ? +(s7[s7.length-1].weight - s7[0].weight).toFixed(1) : null;
    const d30 = s30.length >= 2 ? +(s30[s30.length-1].weight - s30[0].weight).toFixed(1) : null;
    const weights = sorted.map(e => e.weight);
    return { d7, d30, min: Math.min(...weights), max: Math.max(...weights) };
  }, [wts]);

  const dCol = d => d === null ? C.muted : d < 0 ? C.green : d > 0 ? C.red : C.muted;
  const dStr = d => d === null ? '—' : d > 0 ? '+' + d + ' kg' : d + ' kg';

  const goalProg = useMemo(() => {
    if (!goal || !latest || !first) return null;
    const start = first.weight, current = latest.weight, target = +goal, losing = target < start;
    const total = Math.abs(start - target), done = Math.abs(start - current);
    const pct = total > 0 ? Math.min(100, Math.round(done / total * 100)) : 0;
    return { pct, remaining: Math.abs(current - target).toFixed(1), losing, achieved: losing ? current <= target : current >= target };
  }, [goal, wts]);

  if (view === 'detail' && sel) return html`
    <div style=${{ padding:16, paddingTop:24 }}>
      <div style=${{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:16 }}>
        <${BackBar} title="Détail" onBack=${() => { setView('main'); setSel(null); }} />
        <${ConfirmDel} onConfirm=${() => delEntry(sel.id)} label="Supprimer" />
      </div>
      <div style=${{ ...card(C), marginBottom:16 }}>
        <div style=${{ fontFamily:FD, fontSize:48, fontWeight:800, letterSpacing:-1 }}>${sel.weight} <span style=${{ fontSize:20, color:C.muted, fontWeight:400 }}>kg</span></div>
        <div style=${{ color:C.muted, fontSize:14, marginTop:4 }}>${fmtDate(sel.date)}</div>
        ${sel.note ? html`<div style=${{ marginTop:12, color:C.text, fontSize:14, fontStyle:'italic', padding:'10px', background:C.card2, borderRadius:10 }}>${sel.note}</div>` : null}
      </div>
      ${detPhoto ? html`<img src=${detPhoto} style=${{ width:'100%', borderRadius:16, objectFit:'cover', maxHeight:400 }} alt="" />` : null}
    </div>
  `;

  if (view === 'add') return html`
    <div style=${{ padding:16, paddingTop:24 }}>
      <${BackBar} title="Nouvelle pesée" onBack=${() => setView('main')} />
      <div style=${{ display:'flex', flexDirection:'column', gap:14, marginTop:16 }}>
        <div>
          <label style=${{ display:'block', color:C.muted, fontSize:13, marginBottom:6, fontWeight:600 }}>Poids (kg)</label>
          <input type="number" inputMode="decimal" step="0.1" style=${{ ...inpS(C), fontFamily:FD, fontSize:34, fontWeight:800, textAlign:'center', padding:16 }} placeholder="72.5" value=${form.weight} onInput=${e => setForm(f => ({ ...f, weight: e.target.value }))} autoFocus />
        </div>
        <div>
          <label style=${{ display:'block', color:C.muted, fontSize:13, marginBottom:6, fontWeight:600 }}>Date</label>
          <input type="date" style=${inpS(C)} value=${form.date} onChange=${e => setForm(f => ({ ...f, date: e.target.value }))} />
        </div>
        <div>
          <label style=${{ display:'block', color:C.muted, fontSize:13, marginBottom:6, fontWeight:600 }}>Note (optionnel)</label>
          <input style=${inpS(C)} placeholder="Bonne forme..." value=${form.note} onInput=${e => setForm(f => ({ ...f, note: e.target.value }))} />
        </div>
        <div>
          <label style=${{ display:'block', color:C.muted, fontSize:13, marginBottom:6, fontWeight:600 }}>Photo (optionnel)</label>
          <input type="file" accept="image/*" ref=${fileRef} style=${{ display:'none' }} onChange=${e => {
            const f = e.target.files[0]; if (!f) return;
            compressImg(f).then(d => { if (d) setPrev(d); });
          }} />
          ${preview ? html`
            <div style=${{ position:'relative' }}>
              <img src=${preview} style=${{ width:'100%', borderRadius:14, maxHeight:220, objectFit:'cover' }} alt="" />
              <button onClick=${() => setPrev(null)} style=${{ position:'absolute', top:8, right:8, background:'rgba(0,0,0,.7)', border:'none', borderRadius:16, padding:'4px 10px', color:'white', cursor:'pointer', fontSize:12 }}>✕</button>
            </div>
          ` : html`<button onClick=${() => fileRef.current && fileRef.current.click()} style=${{ ...btnS(C, C.card2, C.muted), border:'1px dashed '+C.border }}>Ajouter une photo</button>`}
        </div>
        <button style=${btnS(C)} onClick=${addEntry} disabled=${!form.weight}>Enregistrer</button>
      </div>
    </div>
  `;

  return html`
    <div style=${{ padding:16, paddingTop:16 }}>
      <div style=${{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:16 }}>
        <h2 style=${{ margin:0, fontFamily:FD, fontSize:26, fontWeight:800 }}>Poids</h2>
        <button style=${{ ...btnS(C), width:'auto', padding:'8px 18px', fontSize:14, borderRadius:10 }} onClick=${() => setView('add')}>+ Ajouter</button>
      </div>

      ${!editGoal && goal && goalProg ? html`
        <div style=${{ ...card(C), marginBottom:14, background:goalProg.achieved ? C.green+'15' : C.aGlow, border:'1px solid '+(goalProg.achieved ? C.green : C.accent)+'44' }}>
          <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}>
            <div style=${{ fontSize:12, color:C.muted, fontWeight:700, textTransform:'uppercase' }}>Objectif de poids</div>
            <button onClick=${() => { setEG(true); setGI(goal || ''); }} style=${{ background:'none', border:'none', color:C.muted, cursor:'pointer', fontSize:12 }}>Modifier</button>
          </div>
          ${goalProg.achieved ? html`
            <div style=${{ textAlign:'center', padding:'8px 0' }}>
              <div style=${{ fontSize:32, marginBottom:4 }}>🏆</div>
              <div style=${{ fontWeight:800, fontSize:16, color:C.green }}>Objectif atteint !</div>
            </div>
          ` : html`
            <div>
              <div style=${{ display:'flex', justifyContent:'space-between', marginBottom:6 }}>
                <span style=${{ fontSize:14, fontWeight:700 }}>${latest ? latest.weight + ' kg' : '-'} → <span style=${{ color:C.accent }}>${goal} kg</span></span>
                <span style=${{ fontSize:14, fontWeight:700, color:C.accent }}>${goalProg.pct}%</span>
              </div>
              <div style=${{ height:8, background:C.card2, borderRadius:4, overflow:'hidden', marginBottom:6 }}>
                <div style=${{ height:'100%', background:'linear-gradient(90deg,'+C.accent+','+C.green+')', width:goalProg.pct+'%', borderRadius:4 }}></div>
              </div>
              <div style=${{ fontSize:12, color:C.muted }}>Il te reste <span style=${{ fontWeight:700, color:C.text }}>${goalProg.remaining} kg</span> à ${goalProg.losing ? 'perdre' : 'prendre'}</div>
            </div>
          `}
        </div>
      ` : null}

      ${editGoal || (!goal && latest) ? html`
        <div style=${{ ...card(C), marginBottom:14 }}>
          <div style=${{ fontSize:13, color:C.muted, fontWeight:600, marginBottom:8 }}>${goal ? "Modifier l'objectif" : 'Définir un objectif'}</div>
          <div style=${{ display:'flex', gap:8 }}>
            <input type="number" inputMode="decimal" step="0.1" placeholder="Ex : 75" value=${goalInput} onInput=${e => setGI(e.target.value)} style=${{ ...inpS(C), flex:1, padding:'8px 12px', fontSize:15 }} autoFocus />
            <button onClick=${() => { if (goalInput) { setGoal(+goalInput); setEG(false); } }} style=${{ ...btnS(C), width:'auto', padding:'8px 16px', fontSize:14, borderRadius:10 }}>OK</button>
            ${goal ? html`<button onClick=${() => { setGoal(null); setEG(false); }} style=${{ background:'none', border:'1px solid '+C.border, borderRadius:10, padding:'8px 12px', color:C.muted, cursor:'pointer', fontSize:13 }}>✕</button>` : null}
          </div>
        </div>
      ` : null}

      ${latest ? html`
        <div style=${{ ...card(C), marginBottom:16, padding:20 }}>
          <div style=${{ fontSize:13, color:C.muted, fontWeight:700, letterSpacing:0.2, marginBottom:6 }}>Poids actuel</div>
          <div style=${{ fontFamily:FD, fontSize:53, fontWeight:800, letterSpacing:-2, lineHeight:1 }}>${latest.weight}<span style=${{ fontSize:22, color:C.muted, fontWeight:400 }}> kg</span></div>
          <div style=${{ color:C.muted, fontSize:13, marginTop:4 }}>${fmtDate(latest.date)}</div>
          ${stats ? html`
            <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr 1fr', gap:6, marginTop:16, padding:'12px 0 0', borderTop:'1px solid '+C.border }}>
              ${[['7j', dStr(stats.d7), dCol(stats.d7)], ['30j', dStr(stats.d30), dCol(stats.d30)], ['Min', stats.min+' kg', C.green], ['Max', stats.max+' kg', C.red]].map(([lbl, val, col]) => html`
                <div key=${lbl} style=${{ textAlign:'center' }}>
                  <div style=${{ fontSize:13, fontWeight:700, color:col }}>${val}</div>
                  <div style=${{ fontSize:10, color:C.muted, marginTop:2 }}>${lbl}</div>
                </div>
              `)}
            </div>
          ` : null}
        </div>
      ` : null}

      ${chartData.length > 1 ? html`
        <div style=${{ ...card(C), marginBottom:16 }}>
          <div style=${{ fontWeight:700, fontSize:13, marginBottom:8 }}>Évolution du poids</div>
          <${SvgLine} data=${chartData} color=${C.accent} h=${150} />
        </div>
      ` : null}

      ${sorted.length > 0 ? html`
        <div>
          <div style=${{ color:C.muted, fontSize:13, fontWeight:700, letterSpacing:0.2, marginBottom:8 }}>Historique</div>
          ${[...sorted].reverse().map(entry => html`
            <div key=${entry.id} style=${{ ...card(C), marginBottom:6, cursor:'pointer', display:'flex', alignItems:'center', gap:12 }} onClick=${() => { setSel(entry); setView('detail'); }}>
              ${entry.hasPhoto ? html`<${PhotoThumb} id=${entry.id} />` : null}
              <div style=${{ flex:1, minWidth:0 }}>
                <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                  <div style=${{ fontWeight:700, fontSize:15 }}>${entry.weight} kg</div>
                  <div style=${{ color:C.muted, fontSize:12 }}>${fmtDate(entry.date)}</div>
                </div>
                ${entry.note ? html`<div style=${{ color:C.muted, fontSize:12, marginTop:2, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>${entry.note}</div>` : null}
              </div>
              <span style=${{ color:C.muted, fontSize:20 }}>›</span>
            </div>
          `)}
        </div>
      ` : html`
        <div style=${{ ...card(C), textAlign:'center', padding:36, color:C.muted }}>
          <div style=${{ display:'flex', justifyContent:'center', marginBottom:12 }}><${Ico} name="weight" color=${C.muted} size=${44} /></div>
          <div style=${{ fontWeight:600, color:C.text, marginBottom:4 }}>Aucune pesée</div>
        </div>
      `}
    </div>
  `;
}

function MensSub({ msrs, setMsrs }) {
  const C = useC();
  const [view, setView] = useState('main');
  const [sel, setSel] = useState(null);
  const [chartKey, setChartKey] = useState(MEASURES[0].key);
  const emptyForm = () => { const f = { date: today() }; MEASURES.forEach(m => f[m.key] = ''); return f; };
  const [form, setForm] = useState(emptyForm());

  const save = () => {
    const hasData = MEASURES.some(m => form[m.key] !== '');
    if (!hasData) return;
    const entry = { id: uid(), date: form.date || today(), createdAt: nowISO() };
    MEASURES.forEach(m => { if (form[m.key] !== '') entry[m.key] = +form[m.key]; });
    setMsrs(p => [...p, entry].sort((a, b) => a.date.localeCompare(b.date)));
    setForm(emptyForm()); setView('main');
  };

  const del = id => { setMsrs(p => p.filter(e => e.id !== id)); setView('main'); };
  const setDate = (id, d) => {
    if (!d) return;
    setMsrs(p => p.map(e => e.id === id ? { ...e, date: d } : e).sort((a, b) => a.date.localeCompare(b.date)));
    setSel(x => x ? { ...x, date: d } : x);
  };

  const sorted = [...msrs].sort((a, b) => a.date.localeCompare(b.date));
  const latest = sorted[sorted.length - 1];
  const prev = sorted.length >= 2 ? sorted[sorted.length - 2] : null;
  const diff = key => {
    if (!latest || !prev || latest[key] == null || prev[key] == null) return null;
    return +(latest[key] - prev[key]).toFixed(1);
  };
  const chartData = sorted.filter(e => e[chartKey] != null).map(e => ({ d: fmtS(e.date), v: e[chartKey] }));
  const chartM = MEASURES.find(m => m.key === chartKey);

  if (view === 'detail' && sel) return html`
    <div style=${{ padding:16, paddingTop:24 }}>
      <div style=${{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:16 }}>
        <${BackBar} title="Mensurations" onBack=${() => { setView('main'); setSel(null); }} />
        <${ConfirmDel} onConfirm=${() => del(sel.id)} label="Supprimer" />
      </div>
      <div style=${{ ...card(C), marginBottom:8, padding:'10px 14px', background:C.card2, display:'flex', alignItems:'center', justifyContent:'space-between', gap:12 }}>
        <div style=${{ color:C.muted, fontSize:13 }}>Date de la mesure</div>
        <input type="date" value=${sel.date} max=${today()} onChange=${e => setDate(sel.id, e.target.value)} style=${{ ...inpS(C), width:'auto', padding:'8px 10px', fontSize:14 }} />
      </div>
      ${MEASURES.map(m => sel[m.key] != null ? html`
        <div key=${m.key} style=${{ ...card(C), marginBottom:6, display:'flex', justifyContent:'space-between', alignItems:'center', padding:'12px 16px' }}>
          <div style=${{ fontSize:14, color:C.muted }}>${m.label}</div>
          <div style=${{ fontWeight:700, fontSize:16 }}>${sel[m.key]} <span style=${{ fontSize:12, color:C.muted }}>cm</span></div>
        </div>
      ` : null)}
    </div>
  `;

  if (view === 'add') return html`
    <div style=${{ padding:16, paddingTop:24 }}>
      <${BackBar} title="Nouvelles mensurations" onBack=${() => setView('main')} />
      <div style=${{ display:'flex', flexDirection:'column', gap:10, marginTop:16 }}>
        <div>
          <label style=${{ display:'block', color:C.muted, fontSize:13, marginBottom:6, fontWeight:600 }}>Date</label>
          <input type="date" style=${inpS(C)} value=${form.date} onChange=${e => setForm(f => ({ ...f, date: e.target.value }))} />
        </div>
        <div style=${{ color:C.muted, fontSize:13, fontWeight:700, letterSpacing:0.2, margin:'6px 0 4px' }}>Remplis uniquement ce que tu as mesuré</div>
        ${MEASURES.map(m => html`
          <div key=${m.key} style=${{ display:'flex', alignItems:'center', gap:10 }}>
            <label style=${{ flex:1, fontSize:13, color:C.text }}>${m.label}</label>
            <div style=${{ display:'flex', alignItems:'center', gap:6, width:120 }}>
              <input type="number" inputMode="decimal" step="0.1" placeholder="—" value=${form[m.key]} onInput=${e => { const v = e.target.value; setForm(f => { const nf = { ...f }; nf[m.key] = v; return nf; }); }} style=${{ ...inpS(C), width:80, padding:'8px 10px', fontSize:14, textAlign:'center' }} />
              <span style=${{ color:C.muted, fontSize:12, width:20 }}>cm</span>
            </div>
          </div>
        `)}
        <button style=${{ ...btnS(C), marginTop:8 }} onClick=${save}>Enregistrer</button>
      </div>
    </div>
  `;

  return html`
    <div style=${{ padding:16, paddingTop:16 }}>
      <div style=${{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:16 }}>
        <h2 style=${{ margin:0, fontFamily:FD, fontSize:26, fontWeight:800 }}>Mensurations</h2>
        <button style=${{ ...btnS(C), width:'auto', padding:'8px 18px', fontSize:14, borderRadius:10 }} onClick=${() => setView('add')}>+ Ajouter</button>
      </div>

      ${latest ? html`
        <div style=${{ ...card(C), marginBottom:14 }}>
          <div style=${{ fontSize:13, color:C.muted, fontWeight:700, letterSpacing:0.2, marginBottom:10 }}>Dernières — ${fmtDate(latest.date)}</div>
          ${MEASURES.map(m => {
            if (latest[m.key] == null) return null;
            const d = diff(m.key);
            return html`
              <div key=${m.key} style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'7px 0', borderBottom:'1px solid '+C.border }}>
                <div style=${{ fontSize:13, color:C.muted, flex:1 }}>${m.label}</div>
                <div style=${{ display:'flex', alignItems:'center', gap:10 }}>
                  ${d !== null && d !== 0 ? html`<span style=${{ fontSize:11, fontWeight:700, color:d < 0 ? C.green : C.red }}>${d > 0 ? '+' : ''}${d} cm</span>` : null}
                  <div style=${{ fontWeight:700, fontSize:15, minWidth:52, textAlign:'right' }}>${latest[m.key]} <span style=${{ fontSize:11, color:C.muted }}>cm</span></div>
                </div>
              </div>
            `;
          })}
        </div>
      ` : null}

      ${sorted.length > 1 ? html`
        <div style=${{ ...card(C), marginBottom:14 }}>
          <div style=${{ fontWeight:700, fontSize:13, marginBottom:10 }}>Courbe — ${chartM ? chartM.label : ''}</div>
          <div style=${{ display:'flex', gap:5, flexWrap:'wrap', marginBottom:10 }}>
            ${MEASURES.filter(m => sorted.some(e => e[m.key] != null)).map(m => html`
              <button key=${m.key} onClick=${() => setChartKey(m.key)} style=${{ background:chartKey === m.key ? C.aGlow : 'none', border:'1px solid '+(chartKey === m.key ? C.accent : C.border), borderRadius:20, padding:'3px 10px', color:chartKey === m.key ? C.accent : C.muted, cursor:'pointer', fontSize:11, fontWeight:600 }}>${m.label.split(' ')[0]}</button>
            `)}
          </div>
          ${chartData.length > 1 ? html`<${SvgLine} data=${chartData} color=${C.accent} h=${140} />` : html`<div style=${{ textAlign:'center', color:C.muted, fontSize:13, padding:'20px 0' }}>Pas assez de données.</div>`}
        </div>
      ` : null}

      ${sorted.length > 0 ? html`
        <div>
          <div style=${{ color:C.muted, fontSize:13, fontWeight:700, letterSpacing:0.2, marginBottom:8 }}>Historique</div>
          ${[...sorted].reverse().map(entry => {
            const count = MEASURES.filter(m => entry[m.key] != null).length;
            return html`
              <div key=${entry.id} style=${{ ...card(C), marginBottom:6, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'space-between' }} onClick=${() => { setSel(entry); setView('detail'); }}>
                <div>
                  <div style=${{ fontWeight:700, fontSize:14 }}>${fmtDate(entry.date)}</div>
                  <div style=${{ color:C.muted, fontSize:12, marginTop:2 }}>${count} mesure${count > 1 ? 's' : ''}</div>
                </div>
                <span style=${{ color:C.muted, fontSize:20 }}>›</span>
              </div>
            `;
          })}
        </div>
      ` : html`
        <div style=${{ ...card(C), textAlign:'center', padding:36, color:C.muted }}>
          <div style=${{ display:'flex', justifyContent:'center', marginBottom:12 }}><${Ico} name="ruler" color=${C.muted} size=${44} /></div>
          <div style=${{ fontWeight:600, color:C.text, marginBottom:4 }}>Aucune mensuration</div>
        </div>
      `}
    </div>
  `;
}

// ─── MOUNT ───────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(html`<${RepMemo} />`);
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
